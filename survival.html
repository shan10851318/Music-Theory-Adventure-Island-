<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連對挑戰</title><link rel="stylesheet" href="css/common.css"></head><body><div class="wrap"><div class="top"><a href="index.html">🏠 模式選擇</a><h1>🧠 連對挑戰</h1><span class="badge" id="who"></span></div><div class="card"><span class="big" id="hud"></span></div><div class="card" id="q"></div><div id="nxw"></div></div><script src="js/bank.js"></script><script src="js/store.js"></script><script src="js/engine.js"></script><script>if(typeof Track!=="undefined")Track.start("survival")</script><script>(function(){function box(t){var d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#ffe3e8;color:#7a1630;border-bottom:3px solid #e0577a;padding:10px 14px;font:14px/1.5 sans-serif;white-space:pre-wrap";d.textContent="⚠️ "+t;(document.body||document.documentElement).appendChild(d)}
var m=[];if(typeof Store==="undefined")m.push("js/store.js");if(typeof questions==="undefined")m.push("js/bank.js");if(typeof QZ==="undefined")m.push("js/engine.js");
if(m.length)box("找不到或無法載入："+m.join("、")+"\n請確認 HTML 旁邊有完整的 js/、css/ 資料夾，並直接雙擊資料夾裡的 index.html 開啟（不要在預覽視窗中開啟）。");
window.addEventListener("error",function(e){box(e.message==="Script error."?"共用 JS 檔執行時出錯（瀏覽器隱藏了細節），請按 F12 查看 Console。":e.message)});
try{[["QZ",typeof QZ!=="undefined"?QZ:0],["Store",typeof Store!=="undefined"?Store:0],["Snd",typeof Snd!=="undefined"?Snd:0]].forEach(function(p){var o=p[1];if(!o)return;Object.keys(o).forEach(function(k){var f=o[k];if(typeof f==="function")o[k]=function(){try{return f.apply(this,arguments)}catch(e){box(p[0]+"."+k+"："+e.message);throw e}}})})}catch(e){}})()</script><script>const $=id=>document.getElementById(id);$("who").textContent="👤 "+Store.cur();
let hearts=3,streak=0,max=0,q,ctl;
const hud=()=>$("hud").innerHTML=`${"❤️".repeat(hearts)}${"🖤".repeat(3-hearts)}　🔥 連對 ${streak}　🏅 最佳 ${Math.max(max,Store.stats().survival?.best||0)}`;
function next(){$("nxw").innerHTML="";q=QZ.pick(streak<5?1:streak<10?2:3);ctl=QZ.card($("q"),q,pick);hud()}
function pick(i){const ok=i===q.c;ctl.reveal();if(ok){streak++;max=Math.max(max,streak)}else{ctl.mark(i,"no");hearts--;streak=0;Store.wrong(q)}hud();
 if(hearts<=0){const s=Store.stat("survival",max);$("nxw").innerHTML=`<div class="card"><div class="big">💀 挑戰結束</div><p>這局最高連對 ${max} 題，個人最佳 ${s.best} 題。答錯的題目已收進複習專區。</p><button class="pri" onclick="location.reload()">再挑戰一次</button> <a href="review.html"><button>📝 去複習</button></a></div>`}
 else{$("nxw").innerHTML='<button class="pri" id="nx">下一題 ▶</button>';$("nx").onclick=next}}
next();</script></body></html>
