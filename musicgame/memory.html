<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記憶配對</title><link rel="stylesheet" href="css/common.css"></head><body><div class="wrap"><div class="top"><a href="index.html">🏠 模式選擇</a><h1>🃏 記憶配對</h1><span class="badge" id="who"></span></div><div class="card row"><button class="pri" data-s="音符時值">音符時值</button><button data-s="唱名與音名">唱名與音名</button><span class="badge" id="info"></span></div><div class="card"><div class="mem" id="grid"></div><div id="msg" class="exp" hidden></div></div></div><script src="js/bank.js"></script><script src="js/store.js"></script><script src="js/engine.js"></script><script>if(typeof Track!=="undefined")Track.start("memory")</script><script>(function(){function box(t){var d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#ffe3e8;color:#7a1630;border-bottom:3px solid #e0577a;padding:10px 14px;font:14px/1.5 sans-serif;white-space:pre-wrap";d.textContent="⚠️ "+t;(document.body||document.documentElement).appendChild(d)}
var m=[];if(typeof Store==="undefined")m.push("js/store.js");if(typeof questions==="undefined")m.push("js/bank.js");if(typeof QZ==="undefined")m.push("js/engine.js");
if(m.length)box("找不到或無法載入："+m.join("、")+"\n請確認 HTML 旁邊有完整的 js/、css/ 資料夾，並直接雙擊資料夾裡的 index.html 開啟（不要在預覽視窗中開啟）。");
window.addEventListener("error",function(e){box(e.message==="Script error."?"共用 JS 檔執行時出錯（瀏覽器隱藏了細節），請按 F12 查看 Console。":e.message)});
try{[["QZ",typeof QZ!=="undefined"?QZ:0],["Store",typeof Store!=="undefined"?Store:0],["Snd",typeof Snd!=="undefined"?Snd:0]].forEach(function(p){var o=p[1];if(!o)return;Object.keys(o).forEach(function(k){var f=o[k];if(typeof f==="function")o[k]=function(){try{return f.apply(this,arguments)}catch(e){box(p[0]+"."+k+"："+e.message);throw e}}})})}catch(e){}})()</script><script>const $=id=>document.getElementById(id);$("who").textContent="👤 "+Store.cur();
const ns=(h,s,f)=>`<svg viewBox="0 0 40 56" width="42"><ellipse cx="16" cy="44" rx="9" ry="6.5" transform="rotate(-20 16 44)" fill="${h?"#fff":"#493f5e"}" stroke="#493f5e" stroke-width="2.5"/>${s?'<path d="M24 42V8" stroke="#493f5e" stroke-width="2.5"/>':""}${[...Array(f)].map((_,i)=>`<path d="M24 ${8+i*9}q12 6 8 18" fill="none" stroke="#493f5e" stroke-width="3"/>`).join("")}</svg>`;
const SETS={"音符時值":[["全音符",ns(1,0,0)],["二分音符",ns(1,1,0)],["四分音符",ns(0,1,0)],["八分音符",ns(0,1,1)],["十六分音符",ns(0,1,2)]],"唱名與音名":[["Do","C"],["Re","D"],["Mi","E"],["Fa","F"],["Sol","G"],["La","A"],["Si","B"]]};
let cards,open,moves,found,lock;
function start(k){cards=SETS[k].flatMap((p,i)=>[{p:i,h:p[0]},{p:i,h:p[1]}]).sort(()=>Math.random()-.5);open=[];moves=found=0;lock=false;$("msg").hidden=true;render()}
function render(){$("grid").innerHTML=cards.map((c,i)=>`<button class="mc ${c.on?"open":""} ${c.ok?"ok":""}" data-i="${i}">${c.on?c.h:"🎵"}</button>`).join("");$("info").textContent=`步數 ${moves}　配對 ${found}/${cards.length/2}`;$("grid").querySelectorAll(".mc").forEach(b=>b.onclick=()=>flip(+b.dataset.i))}
function flip(i){if(lock||cards[i].on)return;cards[i].on=1;open.push(i);render();if(open.length<2)return;moves++;const[a,b]=open;
 if(cards[a].p===cards[b].p){cards[a].ok=cards[b].ok=1;found++;open=[];render();if(found===cards.length/2){const s=Store.stat("memory",Math.max(1,60-moves));$("msg").hidden=false;$("msg").textContent=`🎉 全部配對成功！共 ${moves} 步，最高分 ${s.best}。點上方按鈕再玩一次。`}}
 else{lock=true;setTimeout(()=>{cards[a].on=cards[b].on=0;open=[];lock=false;render()},900)}}
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-s]").forEach(x=>x.className=x===b?"pri":"");start(b.dataset.s)});
start("音符時值");</script></body></html>
