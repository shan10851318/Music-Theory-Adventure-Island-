<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搶答擂台</title><link rel="stylesheet" href="css/common.css"></head><body><div class="wrap"><div class="top"><a href="index.html">🏠 模式選擇</a><h1>⚡ 搶答擂台</h1><span class="badge" id="who"></span></div><div class="card" id="setup"><div class="row"><label>隊伍數 <select id="n"><option>2</option><option>3</option><option selected>4</option></select></label><label>題數 <select id="r"><option>5</option><option selected>10</option><option>15</option></select></label></div><div class="row" id="names" style="margin:10px 0"></div><p>規則：題目出現後，按下自己隊伍的 🔔（或鍵盤 1～4）搶答。答對 +10 分再加速度分，答錯 −5 分，該隊本題不能再答，其他隊伍可繼續搶。</p><button class="pri" id="go">開始比賽</button></div>
<div id="game" hidden><div class="card"><div class="row" id="board"></div></div><div class="card"><div class="bar"><i id="bar" style="width:100%"></i></div><div class="row" id="buzz" style="margin:10px 0"></div><div id="q"></div><div id="msg" class="exp" hidden></div><button class="pri" id="nx" hidden>下一題 ▶</button></div></div></div><script src="js/bank.js"></script><script src="js/store.js"></script><script src="js/engine.js"></script><script>if(typeof Track!=="undefined")Track.start("arena")</script><script>(function(){function box(t){var d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#ffe3e8;color:#7a1630;border-bottom:3px solid #e0577a;padding:10px 14px;font:14px/1.5 sans-serif;white-space:pre-wrap";d.textContent="⚠️ "+t;(document.body||document.documentElement).appendChild(d)}
var m=[];if(typeof Store==="undefined")m.push("js/store.js");if(typeof questions==="undefined")m.push("js/bank.js");if(typeof QZ==="undefined")m.push("js/engine.js");
if(m.length)box("找不到或無法載入："+m.join("、")+"\n請確認 HTML 旁邊有完整的 js/、css/ 資料夾，並直接雙擊資料夾裡的 index.html 開啟（不要在預覽視窗中開啟）。");
window.addEventListener("error",function(e){box(e.message==="Script error."?"共用 JS 檔執行時出錯（瀏覽器隱藏了細節），請按 F12 查看 Console。":e.message)});
try{[["QZ",typeof QZ!=="undefined"?QZ:0],["Store",typeof Store!=="undefined"?Store:0],["Snd",typeof Snd!=="undefined"?Snd:0]].forEach(function(p){var o=p[1];if(!o)return;Object.keys(o).forEach(function(k){var f=o[k];if(typeof f==="function")o[k]=function(){try{return f.apply(this,arguments)}catch(e){box(p[0]+"."+k+"："+e.message);throw e}}})})}catch(e){}})()</script><script>const $=id=>document.getElementById(id);$("who").textContent="👤 "+Store.cur();
const E=s=>s.replace(/[<>&"'`]/g,"").trim().slice(0,8);
let T=[],qi=0,R=10,q,ctl,ph="",left=0,lim=15,openLeft=0,cur=-1,out=new Set,tm;
const nm=()=>{$("names").innerHTML=Array.from({length:+$("n").value},(_,i)=>`<input class="tn" maxlength="8" placeholder="第${i+1}隊名稱" value="${["🐱 小貓隊","🐶 小狗隊","🐰 小兔隊","🐼 熊貓隊"][i]}">`).join("")};$("n").onchange=nm;nm();
$("go").onclick=()=>{T=[...document.querySelectorAll(".tn")].map((x,i)=>({n:E(x.value)||"第"+(i+1)+"隊",s:0}));R=+$("r").value;qi=0;$("setup").hidden=true;$("game").hidden=false;nextQ()};
const msg=t=>{$("msg").hidden=false;$("msg").textContent=t};
const bz=f=>$("buzz").querySelectorAll("button").forEach(f);
function board(){$("board").innerHTML=T.map((t,i)=>`<span class="badge" style="font-size:15px;${i===cur?"background:#ffe08a":""}">${t.n}：${t.s} 分</span>`).join("")+`<span class="badge">第 ${qi}/${R} 題</span>`}
function nextQ(){if(qi>=R)return fin();qi++;q=QZ.pick(3);out=new Set;cur=-1;ph="open";left=lim=15;ctl=QZ.card($("q"),q,ans);ctl.lock(true);$("msg").hidden=$("nx").hidden=true;
 $("buzz").innerHTML=T.map((t,i)=>`<button class="sun" data-i="${i}">🔔 ${t.n} (${i+1})</button>`).join("");bz(b=>b.onclick=()=>buzz(+b.dataset.i));board();clearInterval(tm);tm=setInterval(tick,100)}
function tick(){left-=.1;$("bar").style.width=Math.max(0,left/lim*100)+"%";if(left>0)return;if(ph==="open")done("⏰ 時間到，沒有隊伍答對。");else miss(cur,"⏰ 作答超時")}
function buzz(i){if(ph!=="open"||out.has(i))return;cur=i;ph="ans";openLeft=left;left=lim=8;ctl.B.forEach(b=>b.disabled=b.classList.contains("no"));bz(b=>b.disabled=true);board();msg(`🔔 ${T[i].n} 搶到了！請在 8 秒內作答`)}
function ans(i){if(ph!=="ans")return;if(i===q.c){const p=10+Math.ceil(left);T[cur].s+=p;done(`✅ ${T[cur].n} 答對！+${p} 分`)}else{ctl.mark(i,"no");miss(cur,`❌ ${T[cur].n} 答錯`)}}
function miss(i,t){T[i].s-=5;Store.wrong(q,T[i].n);out.add(i);cur=-1;if(out.size>=T.length)return done(t+"，所有隊伍都答過了。");ph="open";left=openLeft;lim=15;ctl.B.forEach(b=>b.disabled=true);bz((b,k)=>b.disabled=out.has(k));msg(t+"，−5 分。其他隊伍可繼續搶答！");board()}
function done(t){clearInterval(tm);ph="end";ctl.reveal();msg(t);board();bz(b=>b.disabled=true);$("nx").hidden=false;$("nx").textContent=qi>=R?"查看結果 🏆":"下一題 ▶"}
$("nx").onclick=nextQ;
function fin(){const r=[...T].sort((a,b)=>b.s-a.s);$("game").innerHTML=`<div class="card"><div class="big">🏆 比賽結束</div>${r.map((t,i)=>`<p class="big">${["🥇","🥈","🥉","4️⃣"][i]} ${t.n}　${t.s} 分</p>`).join("")}<p>各隊答錯的題目已記進複習專區。</p><button class="pri" onclick="location.reload()">再比一場</button></div>`}
document.onkeydown=e=>{const k=+e.key;if(ph&&k>=1&&k<=T.length&&document.activeElement.tagName!=="INPUT")buzz(k-1)};</script></body></html>
