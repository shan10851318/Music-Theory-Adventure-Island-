<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複習專區</title><link rel="stylesheet" href="css/common.css"></head><body><div class="wrap"><div class="top"><a href="index.html">🏠 模式選擇</a><h1>📝 複習專區</h1><span class="badge" id="who"></span></div><div class="card"><div class="row"><label>👤 學生 <select id="u"></select></label><button class="pri" id="st">▶ 開始複習</button><button id="clr">🗑️ 清空錯題</button></div><div id="sum" style="margin-top:10px"></div></div><div id="q" class="card" hidden></div><div id="nxw"></div><div id="list"></div></div><script src="js/bank.js"></script><script src="js/store.js"></script><script src="js/engine.js"></script><script src="js/audio.js"></script><script>if(typeof Track!=="undefined")Track.start("review")</script><script>(function(){function box(t){var d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#ffe3e8;color:#7a1630;border-bottom:3px solid #e0577a;padding:10px 14px;font:14px/1.5 sans-serif;white-space:pre-wrap";d.textContent="⚠️ "+t;(document.body||document.documentElement).appendChild(d)}
var m=[];if(typeof Store==="undefined")m.push("js/store.js");if(typeof questions==="undefined")m.push("js/bank.js");if(typeof QZ==="undefined")m.push("js/engine.js");if(typeof Snd==="undefined")m.push("js/audio.js");
if(m.length)box("找不到或無法載入："+m.join("、")+"\n請確認 HTML 旁邊有完整的 js/、css/ 資料夾，並直接雙擊資料夾裡的 index.html 開啟（不要在預覽視窗中開啟）。");
window.addEventListener("error",function(e){box(e.message==="Script error."?"共用 JS 檔執行時出錯（瀏覽器隱藏了細節），請按 F12 查看 Console。":e.message)});
try{[["QZ",typeof QZ!=="undefined"?QZ:0],["Store",typeof Store!=="undefined"?Store:0],["Snd",typeof Snd!=="undefined"?Snd:0]].forEach(function(p){var o=p[1];if(!o)return;Object.keys(o).forEach(function(k){var f=o[k];if(typeof f==="function")o[k]=function(){try{return f.apply(this,arguments)}catch(e){box(p[0]+"."+k+"："+e.message);throw e}}})})}catch(e){}})()</script><script>const $=id=>document.getElementById(id);$("who").textContent="👤 "+Store.cur();
let u=Store.cur(),L=[],idx=0,q,ctl;
function users(){const us=[...new Set([Store.cur(),...Store.users()])];$("u").innerHTML=us.map(n=>`<option ${n===u?"selected":""}>${n}</option>`).join("")}
function show(){L=Store.list(u).sort((a,b)=>b.n-a.n);const by={};L.forEach(x=>by[x.t]=(by[x.t]||0)+1);
 $("sum").innerHTML=L.length?`共 ${L.length} 題待複習　`+Object.entries(by).map(([t,n])=>`<span class="badge">${TL[t]||t} ${n}</span>`).join(" "):"🎉 目前沒有錯題，太棒了！去其他模式挑戰看看吧。";$("st").disabled=!L.length;
 $("list").innerHTML=L.map((x,i)=>`<div class="card"><span class="badge">${TL[x.t]||x.t}</span> <span class="badge">答錯 ${x.n} 次</span><div class="qt">${x.q}</div>${x.snd?`<button data-p="${i}">🔊 播放</button> `:""}<div>✅ 正解：<b>${x.a[x.c]}</b></div><div class="exp">💡 ${x.e}</div></div>`).join("");
 $("list").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>Snd.play(L[+b.dataset.p].snd))}
$("u").onchange=e=>{u=e.target.value;show()};
$("st").onclick=()=>{L=L.slice().sort(()=>Math.random()-.5);idx=0;$("list").hidden=true;go()};
function go(){$("nxw").innerHTML="";if(idx>=L.length){$("q").hidden=true;$("list").hidden=false;show();$("nxw").innerHTML='<div class="card big">✅ 複習完成！答對的題目已移出錯題本。</div>';return}q=QZ.shuf(L[idx]);$("q").hidden=false;ctl=QZ.card($("q"),q,pick)}
function pick(i){const ok=i===q.c;ctl.reveal();if(ok)Store.master(Store.key(q),u);else{ctl.mark(i,"no");Store.wrong(q,u)}$("nxw").innerHTML=`<button class="pri" id="nx">${idx+1>=L.length?"完成":"下一題 ▶"}</button>`;$("nx").onclick=()=>{idx++;go()}}
$("clr").onclick=()=>{if(confirm("確定清空 "+u+" 的所有錯題？")){Store.clear(u);show()}};
users();show();</script></body></html>
